# Wayland DRM KMS. The boot entry also sets this for early module loading.
options nvidia_drm modeset=1

# Explicit supported RTX 5090 features.
options nvidia NVreg_EnableResizableBar=1
options nvidia NVreg_EnableGpuFirmware=1

# Preserve all VRAM across suspend. The backing path must not be RAM-backed
# /tmp; allow capacity for total VRAM plus margin.
options nvidia NVreg_PreserveVideoMemoryAllocations=1
options nvidia NVreg_TemporaryFilePath=/var/tmp
