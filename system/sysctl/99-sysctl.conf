# Prefer compressed zram over discarding useful file cache under reclaim.
vm.swappiness=150
vm.page-cluster=0
vm.vfs_cache_pressure=50

# Fixed ceilings avoid multi-gigabyte writeback bursts on a 64 GiB host.
vm.dirty_bytes=268435456
vm.dirty_background_bytes=67108864

# This network has no routed IPv6. Avoid Wine/Proton AAAA connection timeouts.
net.ipv6.conf.all.disable_ipv6=1
net.ipv6.conf.default.disable_ipv6=1
